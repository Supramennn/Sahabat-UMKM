name: Verify

on:
  # main dan master sama-sama dicantumkan supaya penggantian nama cabang
  # sewaktu-waktu tidak diam-diam mematikan CI.
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint dan typecheck
        run: npm run lint && npm run typecheck

      # npm test memakai PGlite, jadi tidak butuh layanan database.
      - name: Tes unit dan integrasi
        run: npm test

      - name: Kontras warna komponen
        run: npx tsx scripts/check-ui-contrast.mts

      - name: Bangun frontend
        run: npm run build --workspace apps/web

  postgres-concurrency:
    runs-on: ubuntu-latest
    # Kriteria PRD 6.2 tentang dua pengguna mengeluarkan stok terakhir pada saat
    # bersamaan hanya bisa dibuktikan dengan dua koneksi PostgreSQL sungguhan.
    # PGlite satu koneksi, jadi tes ini tidak bisa berjalan di job verify.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipostgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tes konkurensi
        env:
          TEST_DATABASE_URL: postgres://cipostgres:ci-test-password@127.0.0.1:5432/ci_test
        run: npm run test:postgres
